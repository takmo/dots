[general]
import = [
  "~/.dots/vendor/alacritty-theme/themes/ayu_light.toml"
]

[font]
size = 14
# size = 20

[font.bold]
family = "Fira Code"
style = "Retina"

[font.bold_italic]
family = "Fira Code"
style = "Retina"

[font.italic]
family = "Fira Code"
style = "Retina"

[font.normal]
family = "Fira Code"
style = "Retina"

[scrolling]
history = 0

[terminal.shell]
program = "zsh"

[window]
option_as_alt = "Both"
startup_mode = "Fullscreen"
